name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Astro check (type + frontmatter schema)
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  links:
    name: Link check (internal + external)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lychee internal link check (fail on 4xx for same-site)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,303,304,307,308,429
            --timeout 20
            --max-concurrency 8
            --offline
            --root-dir ${{ github.workspace }}/dist
            --base ${{ github.workspace }}/dist
            --fallback-extensions html
            --exclude-path dist/_astro
            --exclude '%23'
            'dist/**/*.html'
          fail: true  # internal links are authoritative; must resolve
          # --exclude '%23' drops fragment-only hrefs (#footnote anchors).
          # With --root-dir, lychee resolves bare '#foo' as file:///root/%23foo
          # and reports "file not found". Same-page anchors are validated by
          # html-validate / browser, not link-check.
          # --base is deprecated in lychee >=0.23 (warning emitted) but
          # --base-url doesn't accept filesystem paths the same way; keep
          # --base until lychee fixes the upgrade path.

      - name: Lychee external link check (informational)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,303,304,307,308,429
            --timeout 20
            --max-concurrency 8
            --include-verbatim
            --scheme https
            --exclude-path dist/_astro
            --exclude 'parrik.com'
            'dist/**/*.html'
          fail: false  # external links flake, don't block

  styles-loaded:
    # Catches the specific failure class where a page renders without CSS
    # because the stylesheet link or build chunking broke. Validates that
    # every built HTML page has at least one <link rel="stylesheet"> to
    # /_astro/*.css AND that that file exists in dist.
    name: Stylesheet presence check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify every HTML references an existing CSS bundle
        run: |
          set -e
          fail=0
          # Skip standalone HTML copied verbatim from public/ — those are
          # self-contained interactive docs (inline CSS, own styling), not
          # Astro-rendered pages, so they don't reference /_astro/*.css.
          skip_re='^dist/(alex-case-study|example-graph-(full|spine|extended|extended-.*))\.html$'
          for f in $(find dist -name "*.html"); do
            if [[ "$f" =~ $skip_re ]]; then
              continue
            fi
            # Skip Astro-generated redirect pages — they're tiny meta-refresh
            # stubs by design and intentionally don't reference _astro CSS.
            if grep -q '<meta http-equiv="refresh"' "$f"; then
              continue
            fi
            css=$(grep -oE 'href="/_astro/[^"]+\.css"' "$f" | head -1 | sed 's/href="//;s/"$//')
            if [ -z "$css" ]; then
              echo "::error file=$f::No _astro CSS link found in $f"
              fail=1
              continue
            fi
            css_path="dist${css}"
            if [ ! -f "$css_path" ]; then
              echo "::error file=$f::Referenced CSS missing: $css_path"
              fail=1
            fi
          done
          exit $fail

  frontmatter-discipline:
    # Per audit-knife (2026-05-02 self-audit) discipline rules #4 and #5:
    # require `surprise` and `coAuthoredWith` frontmatter fields on
    # non-draft essays. Forcing function for author-surprise discipline
    # and co-authorship honesty before publish.
    name: Essay frontmatter discipline (surprise + coAuthoredWith)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontmatter required fields
        continue-on-error: true  # soft-warn until 2026-05-18; flip after calibration
        run: node scripts/check-essay-frontmatter.mjs

  pr-cooldown:
    # Block merges on PRs that were opened less than N hours ago. Direct
    # counter to high-merge-in-excitement: forces a deliberation gap
    # between "opened" and "merged." Default 12h; override via the env
    # var below for genuine emergencies.
    name: PR-cooldown (deliberation gap)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_COOLDOWN_HOURS: '12'
    steps:
      - uses: actions/checkout@v4
      - name: Verify PR has cooled
        continue-on-error: true  # soft-warn until 2026-05-18; flip after calibration
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          created_at=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .created_at)
          created_epoch=$(date -d "$created_at" +%s)
          now_epoch=$(date +%s)
          age_hours=$(( (now_epoch - created_epoch) / 3600 ))
          required_hours=${PR_COOLDOWN_HOURS}
          echo "PR #$PR_NUMBER opened at $created_at"
          echo "PR age: ${age_hours}h; cooldown required: ${required_hours}h"
          if [ "$age_hours" -lt "$required_hours" ]; then
            remaining=$(( required_hours - age_hours ))
            echo "::warning::PR-cooldown: only ${age_hours}h since open; ${remaining}h to go before cooldown clears."
            exit 1
          fi
          echo "PR-cooldown: cleared."

  slop-lint:
    # Pre-merge gate against AI-generated-text reliability hazards on essay
    # content. Three classes: lexical register, citation/numeric provenance,
    # semantic LLM-judge (mechanism / steel-manning / surprise + arithmetic
    # / contradiction). Pinned by SHA against parrik/slop-lint v0.1.0 — pin
    # changes are deliberate cross-repo commits, not in-session edits.
    #
    # Soft-warn (continue-on-error: true) for calibration window
    # 2026-05-04 → 2026-05-18. After that, promote to hard-fail by
    # removing continue-on-error from the lexical and citations steps. The
    # semantic step stays soft-warn longer (LLM-judge has higher false-fail
    # potential and per-call cost; calibrate independently).
    name: Slop-lint (lexical / citations / semantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to compute changed files for semantic step

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install slop-lint (SHA-pinned, HTTPS)
        # Explicit HTTPS form so npm doesn't try SSH on the runner. Pin moves
        # are deliberate cross-repo commits; bump this SHA to upgrade.
        run: npm install --no-save 'git+https://github.com/parrik/slop-lint.git#7c8edf5234cf2d22f69034b34aa2b737b438cfe0'

      - name: Lexical (regex register tells)
        continue-on-error: true
        run: npx slop-lint lexical src/content/essays/

      - name: Citations (URL resolution + numeric provenance + recency)
        continue-on-error: true
        run: npx slop-lint citations src/content/essays/

      - name: Identify changed essay files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            files=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'src/content/essays/*.md' || true)
          else
            # Push to main: run semantic on essays touched in the merge commit
            files=$(git diff --name-only --diff-filter=AM HEAD~1...HEAD -- 'src/content/essays/*.md' || true)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "no-changed-essays=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-changed-essays=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Semantic LLM-judge (mechanism / steel-manning / surprise + arithmetic / contradiction)
        if: steps.changed.outputs.no-changed-essays != 'true' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            npx slop-lint semantic "$f" || true
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Semantic skipped (no ANTHROPIC_API_KEY secret configured)
        if: env.ANTHROPIC_API_KEY == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "::warning::ANTHROPIC_API_KEY secret not configured; semantic check skipped. Add it under repo Settings → Secrets to enable."

  lighthouse:
    name: Lighthouse audit (perf / a11y / best-practices / SEO)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli

      - name: Run Lighthouse against built site
        run: |
          npx @lhci/cli autorun \
            --config=.lighthouserc.json \
            --collect.staticDistDir=./dist \
            --upload.target=temporary-public-storage
